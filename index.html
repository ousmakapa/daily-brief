<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Daily Brief" />
  <title>Daily Brief</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.png" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c27;
      --border: #2a2a38;
      --text: #f0f0f8;
      --text2: #8888aa;
      --ai: #7c5cfc;
      --nba: #e85d26;
      --padel: #22c55e;
      --shoes: #f59e0b;
      --radius: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overscroll-behavior: none;
    }

    /* ── Header ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: calc(var(--safe-top) + 14px) 20px 14px;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .header-left p { font-size: 12px; color: var(--text2); margin-top: 1px; }

    .refresh-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .refresh-btn:active { opacity: 0.6; }
    .refresh-btn.spinning { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 8px;
      padding: 14px 20px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex-shrink: 0;
      padding: 8px 18px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 600;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text2);
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active { color: #000; border-color: transparent; }
    .tab[data-topic="ai"].active { background: var(--ai); }
    .tab[data-topic="nba"].active { background: var(--nba); }
    .tab[data-topic="padel"].active { background: var(--padel); }
    .tab[data-topic="shoes"].active { background: var(--shoes); }

    /* ── Summary Card ── */
    .summary-wrap { padding: 0 16px 16px; }

    .summary-card {
      border-radius: var(--radius);
      padding: 18px;
      position: relative;
      overflow: hidden;
    }
    .summary-card[data-topic="ai"]    { background: linear-gradient(135deg, #2d1f6e 0%, #1a1a2e 100%); border: 1px solid #7c5cfc44; }
    .summary-card[data-topic="nba"]   { background: linear-gradient(135deg, #5a2010 0%, #1a1212 100%); border: 1px solid #e85d2644; }
    .summary-card[data-topic="padel"] { background: linear-gradient(135deg, #0f3a20 0%, #0a1a10 100%); border: 1px solid #22c55e44; }
    .summary-card[data-topic="shoes"] { background: linear-gradient(135deg, #4a3000 0%, #1a1200 100%); border: 1px solid #f59e0b44; }

    .summary-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 8px;
    }
    .summary-card[data-topic="ai"]    .summary-label { color: var(--ai); }
    .summary-card[data-topic="nba"]   .summary-label { color: var(--nba); }
    .summary-card[data-topic="padel"] .summary-label { color: var(--padel); }
    .summary-card[data-topic="shoes"] .summary-label { color: var(--shoes); }

    .summary-text {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255,255,255,0.9);
    }

    .summary-skeleton {
      display: flex; flex-direction: column; gap: 8px;
    }
    .skeleton-line {
      height: 14px; border-radius: 7px;
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.05) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    .skeleton-line:nth-child(2) { width: 85%; }
    .skeleton-line:nth-child(3) { width: 70%; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ── Feed ── */
    .feed { padding: 0 16px; padding-bottom: calc(var(--safe-bottom) + 100px); }

    .feed-header {
      font-size: 13px;
      font-weight: 700;
      color: var(--text2);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .article-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      display: block;
    }
    .article-card:active { opacity: 0.7; transform: scale(0.99); }

    .article-source {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    [data-topic="ai"]    .article-source { color: var(--ai); }
    [data-topic="nba"]   .article-source { color: var(--nba); }
    [data-topic="padel"] .article-source { color: var(--padel); }
    [data-topic="shoes"] .article-source { color: var(--shoes); }

    .article-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text);
      margin-bottom: 8px;
    }

    .article-desc {
      font-size: 13px;
      color: var(--text2);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .article-meta {
      font-size: 11px;
      color: var(--text2);
      opacity: 0.7;
    }

    .card-skeleton {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 10px;
    }
    .card-skeleton .sk { background: var(--surface2); border-radius: 6px; margin-bottom: 8px; animation: shimmer2 1.5s infinite; }
    .card-skeleton .sk-title { height: 18px; width: 90%; }
    .card-skeleton .sk-desc { height: 13px; width: 100%; }
    .card-skeleton .sk-desc2 { height: 13px; width: 70%; }
    .card-skeleton .sk-meta { height: 11px; width: 40%; }
    @keyframes shimmer2 {
      0%,100% { opacity: 0.4; } 50% { opacity: 0.8; }
    }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text2);
    }
    .empty .icon { font-size: 40px; margin-bottom: 10px; }
    .empty p { font-size: 15px; }

    /* ── Settings overlay ── */
    .settings-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      align-items: flex-end;
    }
    .settings-overlay.open { display: flex; }

    .settings-sheet {
      width: 100%;
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 20px 24px calc(var(--safe-bottom) + 24px);
    }

    .sheet-handle {
      width: 40px; height: 5px;
      background: var(--border);
      border-radius: 3px;
      margin: 0 auto 20px;
    }

    .settings-sheet h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }

    .settings-sheet label {
      display: block;
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .settings-sheet input {
      width: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      margin-bottom: 16px;
      font-family: 'SF Mono', monospace;
    }
    .settings-sheet input:focus { border-color: var(--ai); }

    .save-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      background: var(--ai);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    .save-btn:active { opacity: 0.8; }

    .settings-note {
      font-size: 12px;
      color: var(--text2);
      margin-top: 12px;
      line-height: 1.5;
      text-align: center;
    }

    /* ── Settings gear button ── */
    .gear-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }

    .header-btns { display: flex; gap: 8px; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 20px);
      left: 50%; transform: translateX(-50%);
      background: #fff;
      color: #000;
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 600;
      z-index: 300;
      opacity: 0;
      transition: opacity 0.3s;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* ── Setup banner ── */
    .setup-banner {
      margin: 0 16px 16px;
      background: linear-gradient(135deg, #2d1f6e, #1a1a2e);
      border: 1px solid var(--ai);
      border-radius: var(--radius);
      padding: 16px;
    }
    .setup-banner p { font-size: 14px; line-height: 1.5; }
    .setup-banner strong { color: var(--ai); }
    .setup-banner-btn {
      margin-top: 12px;
      padding: 10px 18px;
      border-radius: 10px;
      background: var(--ai);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <h1>Daily Brief</h1>
    <p id="date-label">Loading...</p>
  </div>
  <div class="header-btns">
    <button class="gear-btn" onclick="openSettings()">⚙️</button>
    <button class="refresh-btn" id="refresh-btn" onclick="refreshAll()">↻</button>
  </div>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab active" data-topic="ai"    onclick="switchTab('ai')">🤖 AI</button>
  <button class="tab"        data-topic="nba"   onclick="switchTab('nba')">🏀 NBA</button>
  <button class="tab"        data-topic="padel" onclick="switchTab('padel')">🎾 Padel</button>
  <button class="tab"        data-topic="shoes" onclick="switchTab('shoes')">👟 Sneakers</button>
</div>

<!-- Setup banner (shown if no API key) -->
<div class="setup-banner" id="setup-banner" style="display:none">
  <p>Add your <strong>OpenAI API key</strong> to unlock daily AI-generated summaries for each topic.</p>
  <button class="setup-banner-btn" onclick="openSettings()">Add API Key →</button>
</div>

<!-- Summary Card -->
<div class="summary-wrap">
  <div class="summary-card" id="summary-card" data-topic="ai">
    <div class="summary-label">✦ Today's Brief</div>
    <div id="summary-content" class="summary-skeleton">
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
    </div>
  </div>
</div>

<!-- Feed -->
<div class="feed">
  <div class="feed-header" id="feed-header">Latest News</div>
  <div id="articles-list"></div>
</div>

<!-- Settings Overlay -->
<div class="settings-overlay" id="settings-overlay" onclick="closeSettingsIfOutside(event)">
  <div class="settings-sheet">
    <div class="sheet-handle"></div>
    <h2>Settings ⚙️</h2>
    <label>OpenAI API Key</label>
    <input type="password" id="api-key-input" placeholder="sk-..." autocomplete="off" autocorrect="off" />
    <button class="save-btn" onclick="saveSettings()">Save & Generate Summary</button>
    <p class="settings-note">
      Your key is stored only on this device.<br/>
      Get a free key at <strong>platform.openai.com</strong>
    </p>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── Config ───────────────────────────────────────────────────────────────────

const TOPICS = {
  ai: {
    label: 'AI',
    emoji: '🤖',
    feeds: [
      'https://techcrunch.com/category/artificial-intelligence/feed/',
      'https://www.artificialintelligence-news.com/feed/',
    ],
    summaryPrompt: 'Summarize the top AI and machine learning news from today in 3-4 engaging sentences. Focus on the most impactful developments.',
  },
  nba: {
    label: 'NBA',
    emoji: '🏀',
    feeds: [
      'https://www.espn.com/espn/rss/nba/news',
      'https://bleacherreport.com/nba.rss',
    ],
    summaryPrompt: 'Summarize the top NBA news and highlights from today in 3-4 engaging sentences. Include key games, trades, or player news.',
  },
  padel: {
    label: 'Padel',
    emoji: '🎾',
    feeds: [
      'https://www.worldpadeltour.com/en/feed/',
      'https://padel-magazine.com/feed/',
    ],
    summaryPrompt: 'Summarize the top padel news from today in 3-4 engaging sentences. Include tournament results, player news, or industry updates.',
  },
  shoes: {
    label: 'Sneakers',
    emoji: '👟',
    feeds: [
      'https://sneakernews.com/feed/',
      'https://www.highsnobiety.com/sneakers/rss/',
    ],
    summaryPrompt: 'Summarize the top sneaker news today in 3-4 sentences. Cover Nike, Adidas, Jordan, and other major drops or collabs.',
  },
};

const RSS2JSON = 'https://api.rss2json.com/v1/api.json?count=8&rss_url=';
const CACHE_KEY = 'daily_brief_cache';
const CACHE_TTL = 6 * 60 * 60 * 1000; // 6 hours

// ─── State ────────────────────────────────────────────────────────────────────

let currentTopic = 'ai';
let cache = {};
let isRefreshing = false;

// ─── Init ─────────────────────────────────────────────────────────────────────

document.addEventListener('DOMContentLoaded', () => {
  updateDateLabel();
  loadCache();
  checkApiKey();
  loadTopic('ai');

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
});

function updateDateLabel() {
  const now = new Date();
  document.getElementById('date-label').textContent =
    now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}

function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (raw) cache = JSON.parse(raw);
  } catch {}
}

function saveCache() {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch {}
}

function getApiKey() {
  return localStorage.getItem('openai_key') || '';
}

function checkApiKey() {
  const key = getApiKey();
  document.getElementById('setup-banner').style.display = key ? 'none' : 'block';
  if (key) document.getElementById('api-key-input').value = key;
}

// ─── Tab switching ────────────────────────────────────────────────────────────

function switchTab(topic) {
  currentTopic = topic;

  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-topic="${topic}"]`).classList.add('active');

  document.getElementById('summary-card').dataset.topic = topic;
  document.getElementById('feed-header').textContent =
    `${TOPICS[topic].emoji} ${TOPICS[topic].label} News`;

  loadTopic(topic);
}

// ─── Load topic ───────────────────────────────────────────────────────────────

async function loadTopic(topic) {
  const cached = cache[topic];
  const now = Date.now();

  if (cached && (now - cached.ts) < CACHE_TTL) {
    renderArticles(topic, cached.articles);
    renderSummary(topic, cached.summary);
    return;
  }

  showSkeletons();
  await fetchAndRender(topic);
}

async function refreshAll() {
  if (isRefreshing) return;
  isRefreshing = true;
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');

  delete cache[currentTopic];
  saveCache();
  showSkeletons();
  await fetchAndRender(currentTopic);

  btn.classList.remove('spinning');
  isRefreshing = false;
}

async function fetchAndRender(topic) {
  try {
    const articles = await fetchNews(topic);
    const summary = await generateSummary(topic, articles);

    cache[topic] = { ts: Date.now(), articles, summary };
    saveCache();

    renderArticles(topic, articles);
    renderSummary(topic, summary);
  } catch (err) {
    console.error(err);
    renderError();
  }
}

// ─── News fetching ────────────────────────────────────────────────────────────

async function fetchNews(topic) {
  const feeds = TOPICS[topic].feeds;
  const results = await Promise.allSettled(
    feeds.map(url => fetchFeed(url))
  );

  let articles = [];
  for (const r of results) {
    if (r.status === 'fulfilled') articles = articles.concat(r.value);
  }

  // Deduplicate by title
  const seen = new Set();
  articles = articles.filter(a => {
    if (seen.has(a.title)) return false;
    seen.add(a.title);
    return true;
  });

  return articles.slice(0, 10);
}

async function fetchFeed(url) {
  const resp = await fetch(RSS2JSON + encodeURIComponent(url));
  if (!resp.ok) throw new Error('Feed failed');
  const data = await resp.json();
  if (data.status !== 'ok') throw new Error('Feed error');

  return data.items.map(item => ({
    title: stripHtml(item.title || ''),
    description: stripHtml(item.description || item.content || '').slice(0, 200),
    link: item.link || '#',
    source: data.feed?.title || new URL(url).hostname.replace('www.', ''),
    date: formatDate(item.pubDate),
  }));
}

function stripHtml(html) {
  return html.replace(/<[^>]*>/g, '').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#039;/g,"'").replace(/\s+/g,' ').trim();
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr);
    const now = new Date();
    const diff = Math.floor((now - d) / 60000);
    if (diff < 60) return `${diff}m ago`;
    if (diff < 1440) return `${Math.floor(diff/60)}h ago`;
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  } catch { return ''; }
}

// ─── OpenAI Summary ───────────────────────────────────────────────────────────

async function generateSummary(topic, articles) {
  const key = getApiKey();
  if (!key || !articles.length) return null;

  const headlines = articles.slice(0, 6).map((a, i) => `${i+1}. ${a.title}`).join('\n');
  const prompt = TOPICS[topic].summaryPrompt;

  try {
    const resp = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`,
      },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        max_tokens: 200,
        messages: [
          { role: 'system', content: 'You are a sharp, concise news briefer. Write in an engaging, clear style. No bullet points.' },
          { role: 'user', content: `${prompt}\n\nHeadlines:\n${headlines}` },
        ],
      }),
    });

    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.error?.message || 'OpenAI error');
    }

    const data = await resp.json();
    return data.choices[0].message.content.trim();
  } catch (err) {
    console.warn('Summary failed:', err.message);
    return null;
  }
}

// ─── Rendering ────────────────────────────────────────────────────────────────

function showSkeletons() {
  document.getElementById('summary-content').innerHTML = `
    <div class="summary-skeleton">
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
    </div>`;

  let html = '';
  for (let i = 0; i < 4; i++) {
    html += `<div class="card-skeleton">
      <div class="sk sk-title"></div>
      <div class="sk sk-desc"></div>
      <div class="sk sk-desc2"></div>
      <div class="sk sk-meta"></div>
    </div>`;
  }
  document.getElementById('articles-list').innerHTML = html;
}

function renderSummary(topic, text) {
  const el = document.getElementById('summary-content');
  if (!text) {
    el.innerHTML = `<p class="summary-text" style="opacity:0.5">
      ${getApiKey() ? 'Could not generate summary — check your API key.' : 'Add an OpenAI API key in Settings to get AI summaries.'}
    </p>`;
    return;
  }
  el.innerHTML = `<p class="summary-text">${text}</p>`;
}

function renderArticles(topic, articles) {
  const list = document.getElementById('articles-list');

  if (!articles.length) {
    list.innerHTML = `<div class="empty"><div class="icon">📭</div><p>No articles found. Try refreshing.</p></div>`;
    return;
  }

  list.innerHTML = articles.map(a => `
    <a class="article-card" href="${a.link}" target="_blank" rel="noopener" data-topic="${topic}">
      <div class="article-source">${a.source}</div>
      <div class="article-title">${a.title}</div>
      ${a.description ? `<div class="article-desc">${a.description}</div>` : ''}
      <div class="article-meta">${a.date}</div>
    </a>
  `).join('');
}

function renderError() {
  document.getElementById('summary-content').innerHTML =
    `<p class="summary-text" style="opacity:0.5">Could not load news. Check your connection.</p>`;
  document.getElementById('articles-list').innerHTML =
    `<div class="empty"><div class="icon">⚠️</div><p>Failed to load. Tap ↻ to retry.</p></div>`;
}

// ─── Settings ─────────────────────────────────────────────────────────────────

function openSettings() {
  document.getElementById('settings-overlay').classList.add('open');
}

function closeSettingsIfOutside(e) {
  if (e.target === document.getElementById('settings-overlay')) {
    document.getElementById('settings-overlay').classList.remove('open');
  }
}

function saveSettings() {
  const key = document.getElementById('api-key-input').value.trim();
  if (key && !key.startsWith('sk-')) {
    showToast('⚠️ Key should start with sk-');
    return;
  }
  if (key) localStorage.setItem('openai_key', key);
  else localStorage.removeItem('openai_key');

  document.getElementById('settings-overlay').classList.remove('open');
  checkApiKey();

  // Bust cache to regenerate summary
  delete cache[currentTopic];
  saveCache();
  showToast('✓ Saved! Refreshing...');
  setTimeout(() => loadTopic(currentTopic), 500);
}

// ─── Toast ────────────────────────────────────────────────────────────────────

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
